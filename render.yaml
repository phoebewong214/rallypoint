# Render Blueprint — deploys the Flask API + a managed Postgres.
# In Render: New → Blueprint → pick this repo. It reads this file.
# Frontend is deployed separately on Vercel (see DEPLOY.md).
databases:
  - name: rallypoint-db
    plan: free          # NOTE: Render's free Postgres expires ~30 days; upgrade for real use.

services:
  - type: web
    name: rallypoint-api
    runtime: python
    plan: free          # NOTE: free web services sleep after inactivity (first request is slow).
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # upgrade-db runs Alembic migrations at startup (no Shell/Jobs needed on the
    # free tier). It is idempotent: a fresh DB gets the full chain, an existing
    # pre-migrations DB is adopted via a one-time stamp, and a migrated DB just
    # applies anything pending. import-courts --if-empty seeds the real Chicago
    # courts on a fresh DB and is a near-instant no-op once populated. The
    # import is wrapped in (… || echo) so a seeding error can never block
    # gunicorn from starting.
    # gevent worker (via wsgi_gevent, which monkey-patches before app import):
    # SSE streams (/api/stream) hold a connection open per client, which would
    # permanently occupy a sync worker each — greenlets multiplex them all on
    # one worker instead. Keep --workers 1: the invite push broker is
    # in-process, so a second worker's subscribers would miss events published
    # from the first.
    startCommand: python manage.py upgrade-db && (python manage.py import-courts --if-empty || echo "import-courts failed, continuing") && gunicorn wsgi_gevent:app --bind 0.0.0.0:$PORT -k gevent --workers 1 --timeout 60
    healthCheckPath: /api/health
    envVars:
      - key: SECRET_KEY
        generateValue: true                 # Render generates a strong secret
      - key: DATABASE_URL
        fromDatabase:
          name: rallypoint-db
          property: connectionString
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: Lax
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USE_TLS
        value: "true"
      # --- fill these in the Render dashboard (Environment tab) ---
      - key: APP_BASE_URL          # e.g. https://app.yourdomain.com
        sync: false
      - key: CORS_ORIGINS          # e.g. https://app.yourdomain.com
        sync: false
      - key: COOKIE_DOMAIN         # e.g. .yourdomain.com  (shares cookie across subdomains)
        sync: false
      - key: SMTP_HOST             # smtp.resend.com
        sync: false
      - key: SMTP_USER             # resend
        sync: false
      - key: SMTP_PASSWORD         # your Resend API key (re_...)
        sync: false
      - key: SMTP_FROM             # RallyPoint <no-reply@yourdomain.com>
        sync: false
      - key: SUPPORT_ADMIN_EMAIL   # where "talk to a human" support requests are emailed (use an inbox you read)
        sync: false
      - key: BOOTSTRAP_ADMIN_EMAIL # optional — email(s) auto-promoted to admin on deploy (comma-separated); grants the first admin without a shell
        sync: false
      - key: OPENAI_API_KEY        # optional — enables AI match reasons + AI support replies; blank = heuristic/escalation only
        sync: false
      - key: SENTRY_DSN            # optional — error tracking; blank = disabled (sentry.io → project → DSN)
        sync: false
